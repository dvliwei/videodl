schema_version: 2

ffmpeg:
  version: "8.1.2 (macOS/Windows); 8.0.3 (Linux)"
  branch: "8.1 (macOS/Windows); 8.0 (Linux)"
  release_date: "2026-07-14 (macOS/Windows); 2026-06-18 (Linux)"
  upstream_homepage: "https://ffmpeg.org"
  upstream_repository: "https://github.com/FFmpeg/FFmpeg"

license:
  type: "LGPL-2.1-or-later"
  distribution_model: "standalone subprocess; VideoDL does not link FFmpeg libraries"
  policy: "no GPL, nonfree, or version3-only components"
  license_files:
    - "licenses/FFmpeg-COPYING.LGPLv2.1"
    - "licenses/THIRD-PARTY-NOTICES.md"
    - "licenses/OPENSSL-LICENSE.txt"
    - "licenses/LIBVPL-LICENSE.txt"
    - "licenses/LIBWINPTHREAD-LICENSE.txt"
    - "licenses/LIBOPENH264-LICENSE.txt"
    - "licenses/GCC-LICENSE.txt"

source:
  provider: "serversideup/ffmpeg-lgpl-builds (macOS/Windows); AtlasYang/ffmpeg-static-builds (Linux)"
  provider_url: "https://github.com/serversideup/ffmpeg-lgpl-builds"
  release_tag: "v8.1.2-27 (macOS/Windows); ffmpeg-8.0.3-build4 (Linux)"
  release_url: "https://github.com/serversideup/ffmpeg-lgpl-builds/releases/tag/v8.1.2-27"
  source_archive_url: "https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz"
  source_signature_url: "https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz.asc"
  modified: false

encoders:
  video:
    - name: "libvpx-vp9"
      license: "BSD-3-Clause"
      use: "VP8/VP9 compatibility output"
    - name: "libaom-av1"
      license: "BSD-2-Clause + AOM Patent License 1.0"
      use: "AV1 output when selected by a future fixed preset"
  audio:
    - name: "aac"
      license: "LGPL-2.1-or-later"
      use: "MP4 compatibility preset"
    - name: "libopus"
      license: "BSD-3-Clause"
      use: "Opus output"
    - name: "libvorbis"
      license: "BSD-3-Clause"
      use: "Vorbis output"
  excluded:
    - "libx264"
    - "libx265"
    - "libfdk-aac"

decoders:
  note: "The provider build includes the FFmpeg decoders needed for common H.264/H.265/AV1/VP8/VP9/AAC/MP3/Opus/FLAC media. Exact registrations are recorded in each configure report."
  hardware_acceleration:
    - "VideoToolbox (macOS)"
    - "D3D11VA/D3D12VA/DXVA2/Media Foundation (Windows)"
    - "Vulkan Video (Linux)"

demuxers_muxers:
  containers:
    - "mp4"
    - "mkv"
    - "webm"
    - "ts"
    - "mov"
    - "flv"
    - "hls"
    - "dash"

platforms:
  windows-x64:
    goos: "windows"
    goarch: "amd64"
    archive_url: "https://github.com/serversideup/ffmpeg-lgpl-builds/releases/download/v8.1.2-27/ffmpeg-8.1.2-x86_64-pc-windows-msvc.tar.gz"
    archive_format: "tar.gz"
    archive_sha256: "fb2de01912edb449a5eba1cc487696c7f71ebb7b325e5c5c69434642ec2ba6b0"
    tool_paths:
      ffmpeg: "ffmpeg.exe"
      ffprobe: "ffprobe.exe"
    extract_root: ""
    configure_report_url: "https://github.com/serversideup/ffmpeg-lgpl-builds/releases/tag/v8.1.2-27"
    minimum_os: "Windows 10"
  linux-x64:
    goos: "linux"
    goarch: "amd64"
    archive_url: "https://github.com/AtlasYang/ffmpeg-static-builds/releases/download/ffmpeg-8.0.3-build4/ffmpeg-8.0.3-linux-x64.tar.gz"
    archive_format: "tar.gz"
    archive_sha256: "2612ed26322c864a7411c3578b74fe7f229127e6f9f906d3aa994937a4c9620e"
    tool_paths:
      ffmpeg: "ffmpeg"
      ffprobe: "ffprobe"
    extract_root: ""
    configure_report_url: "https://github.com/AtlasYang/ffmpeg-static-builds/releases/download/ffmpeg-8.0.3-build4/ffmpeg-8.0.3-linux-x64.configure.txt"
    minimum_os: "Linux glibc 2.35 (Ubuntu 22.04+/Debian 12+/RHEL 9+)"
  darwin-x64:
    goos: "darwin"
    goarch: "amd64"
    archive_url: "https://github.com/serversideup/ffmpeg-lgpl-builds/releases/download/v8.1.2-27/ffmpeg-8.1.2-x86_64-apple-darwin.tar.gz"
    archive_format: "tar.gz"
    archive_sha256: "51ac761dde58a600bb685a5d2510ae38d6ade1f62ef2ef556263c67cb69f2b00"
    tool_paths:
      ffmpeg: "ffmpeg"
      ffprobe: "ffprobe"
    extract_root: ""
    configure_report_url: "https://github.com/serversideup/ffmpeg-lgpl-builds/releases/tag/v8.1.2-27"
    minimum_os: "macOS 12 Monterey"
    codesign_required: true
  darwin-arm64:
    goos: "darwin"
    goarch: "arm64"
    archive_url: "https://github.com/serversideup/ffmpeg-lgpl-builds/releases/download/v8.1.2-27/ffmpeg-8.1.2-aarch64-apple-darwin.tar.gz"
    archive_format: "tar.gz"
    archive_sha256: "ac0babf65798bf681da1dc81c4fe4ae049d0d26e161410174b0e120e3e783332"
    tool_paths:
      ffmpeg: "ffmpeg"
      ffprobe: "ffprobe"
    extract_root: ""
    configure_report_url: "https://github.com/serversideup/ffmpeg-lgpl-builds/releases/tag/v8.1.2-27"
    minimum_os: "macOS 12 Monterey"
    codesign_required: true

build_options:
  required_protocols:
    - "https"
    - "tls"
  required_policy_flags:
    - "--disable-gpl"
    - "--disable-nonfree"
    - "--disable-version3"
    - "--disable-autodetect"
  packaging: "macOS/Windows archives include ffmpeg, ffprobe, and required license/runtime files; Linux retains the previous two-tool archive"
  configuration_source: "macOS/Windows configuration is recorded in the v8.1.2-27 release; Linux configuration remains pinned by its existing configure_report_url."

source_distribution:
  obligation: "Ship the LGPL-2.1-or-later notice and applicable third-party notices with every release. Keep the exact upstream source URL, release signature and provider configure reports available beside the release."
  source_archive_url: "https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz"
  source_signature_url: "https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz.asc"
  source_revision: "n8.1.2 (macOS/Windows); n8.0.3 (Linux)"
  build_revision: "v8.1.2-27 (macOS/Windows); ffmpeg-8.0.3-build4 (Linux)"
  modified_source: false
  source_offer: "Release materials link to the exact unmodified upstream source and the provider's per-target configuration audit."

post_mvp_platforms:
  - "linux-arm64: provider asset is available, but excluded from the current product launch matrix until separately tested and documented"
